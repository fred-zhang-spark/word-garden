<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#DCEAF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="单词花园">
<title>单词花园</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<main id="app">

  <!-- ============ 花园（首页） ============ -->
  <section class="view" id="view-garden" data-view="garden">
    <header class="top">
      <div>
        <div class="hello" id="greeting">下午好呀，</div>
        <h1 class="title">我的<span>单词花园</span></h1>
      </div>
      <button class="avatar" id="avatar" type="button" data-go="me" aria-label="我的">🌱</button>
    </header>

    <div class="garden-card">
      <div class="stats">
        <div class="pill p-blue"><b id="stat-total">0</b>已种下</div>
        <div class="pill p-green"><b id="stat-today">0</b>今天新词</div>
        <div class="pill p-apricot"><b id="stat-streak">0</b>天连续</div>
      </div>
      <div class="hill" id="hill"></div>
    </div>

    <h2 class="sec">今天想收点什么</h2>
    <div class="actions">
      <button class="act" type="button" data-go="search">
        <span class="ico i-blue">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg>
        </span>查一个词
      </button>
      <button class="act" type="button" data-camera="object">
        <span class="ico i-green">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M2.5 6.5h3l1.5-2h6l1.5 2h3v9h-15z"/><circle cx="10" cy="11" r="3"/></svg>
        </span>拍个东西
      </button>
      <button class="act" type="button" data-camera="list">
        <span class="ico i-apricot">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="2.5" width="13" height="15" rx="2"/><path d="M7 7h6M7 10h6M7 13h3.5"/></svg>
        </span>拍单词表
      </button>
    </div>

    <button class="quiz-card" id="quiz-card" type="button" data-go="quiz">
      <div class="quiz-txt">
        <h3 id="quiz-title">浇水时间到啦</h3>
        <p id="quiz-sub">还没有词可以复习，先去收几个吧</p>
      </div>
      <span class="go">去浇水</span>
    </button>

    <h2 class="sec">刚种下的</h2>
    <div class="chips" id="recent"></div>
    <div class="empty" id="garden-empty" hidden>
      花园还是空的。<br>点上面的「拍个东西」，对着身边任何东西拍一张试试。
    </div>
  </section>

  <!-- ============ 查词 ============ -->
  <section class="view" id="view-search" data-view="search" hidden>
    <header class="top simple">
      <button class="back" type="button" data-go="garden" aria-label="返回">←</button>
      <h1 class="title sm">查一个词</h1>
    </header>
    <form class="search-box" id="search-form">
      <input id="search-input" type="search" placeholder="想知道什么东西的英文？" autocomplete="off" enterkeyhint="search">
      <button type="submit" aria-label="查询">查</button>
    </form>
    <p class="tip">中文、拼音都行，比如「蜗牛」「梯子」「打喷嚏」</p>
    <div id="search-result"></div>
  </section>

  <!-- ============ 拍照结果 ============ -->
  <section class="view" id="view-capture" data-view="capture" hidden>
    <header class="top simple">
      <button class="back" type="button" data-go="garden" aria-label="返回">←</button>
      <h1 class="title sm" id="capture-title">照片里的东西</h1>
    </header>
    <div id="capture-body"></div>
  </section>

  <!-- ============ 单词本 ============ -->
  <section class="view" id="view-book" data-view="book" hidden>
    <header class="top simple">
      <h1 class="title sm">我的单词本</h1>
      <input id="book-filter" type="search" placeholder="找一个词" autocomplete="off">
    </header>
    <div id="book-list"></div>
  </section>

  <!-- ============ 浇水（测验） ============ -->
  <section class="view" id="view-quiz" data-view="quiz" hidden>
    <header class="top simple">
      <button class="back" type="button" data-go="garden" aria-label="返回">←</button>
      <div class="progress"><span id="quiz-progress"></span></div>
    </header>
    <div id="quiz-body"></div>
  </section>

  <!-- ============ 我的 ============ -->
  <section class="view" id="view-me" data-view="me" hidden>
    <header class="top simple">
      <h1 class="title sm">我的</h1>
    </header>
    <div id="me-body"></div>
  </section>

</main>

<nav class="nav" id="nav">
  <button type="button" data-go="garden" class="on">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 17V8"/><path d="M10 9C7 9 5 7 5 4c3 0 5 2 5 5z"/><path d="M10 12c3 0 5-2 5-5-3 0-5 2-5 5z"/></svg>花园
  </button>
  <button type="button" data-go="book">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 4.5h5a2 2 0 0 1 2 2v9a2 2 0 0 0-2-2H3z"/><path d="M17 4.5h-5a2 2 0 0 0-2 2v9a2 2 0 0 1 2-2h5z"/></svg>词本
  </button>
  <button type="button" data-go="quiz">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m10 3 2.2 4.5 5 .7-3.6 3.5.9 4.9L10 14.3l-4.5 2.3.9-4.9L2.8 8.2l5-.7z"/></svg>浇水
  </button>
  <button type="button" data-go="me">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="7.5" r="3.2"/><path d="M4 16.5c1-2.8 3.2-4.2 6-4.2s5 1.4 6 4.2"/></svg>我的
  </button>
</nav>

<input type="file" id="file-input" accept="image/*" capture="environment" hidden>

<div class="toast" id="toast" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
